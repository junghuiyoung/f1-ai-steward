[project]
name = "f1aisteward"
version = "0.1.0"
description = "Describe a Formula 1 incident, get the rule, the usual penalty and similar past stewards' decisions."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pypdf>=7.1.0",
    "pyyaml>=6.0.3",
    "typer>=0.29.1",
]

[project.scripts]
f1aisteward = "f1aisteward.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1aisteward"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
